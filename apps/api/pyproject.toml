[project]
name = "finpilot-api"
version = "0.3.0"
description = "FinPilot — personal finance decision-support agent backend (Phase 2 base + Phase 3 data foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "supabase>=2.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live Supabase project (skipped when not configured)",
]
addopts = "-ra --strict-markers"

[tool.setuptools.packages.find]
include = ["app*"]